    controls:
      configure_seo: Configure SEO
      update_seo: Update SEO
      reset_seo: Reset SEO

    meta_seo:
      title: SEO settings - Meta
      note_prefix: "Note:"
      managed: Managed
      saved: Saved!

      close:
        close: Close
        save: Save
        save_autofill: Save & auto-fill
        autofill_info: This change will revert custom changes and fill the meta-tags with item-data.

      unsupported_object:
        title: This object is not a supported SeoMeta object
        docs_link: Documentation

      auto_update:
        label: Auto update meta tags
        help: When enabled, this items meta tags are automatically updated when the object changes.
        switch: Update object SEO on change

      meta_title:
        label: Meta title
        help: Title in search engines.
        placeholder: Enter page title

      meta_description:
        label: Meta description
        help: Describes the item and shown in search engines.

      keywords:
        label: Keywords
        help: Enter one or more keywords that describes this item.
        placeholder: Add a few keywords
        comma_note: "Note: Separate keywords with a comma."
        example: "Example: flarum, web development, forum, apples, security"

      image:
        label: Meta image
        help: Displays an image.
        placeholder: Enter image URL
        managed_by: "Image source managed by {source}"
        upload: Upload file

      robots:
        label: Robots
        help: Robot-crawling settings for this item.

        tags:
          indexing_allowed: Allow indexing page
          indexing_not_allowed: Page indexing not allowed
          follow_allowed: Allow follow links
          follow_not_allowed: Link following not allowed
          archive_not_allowed: Archiving pages not allowed
          imageindex_not_allowed: Image indexing not allowed
          snippet_not_allowed: Taking text-snippets not allowed

        switch:
          indexing: Allow indexing page
          follow: Allow following links to different pages
          noarchive: Disable archiving page (noarchive)
          noimageindex: Disable indexing images on this page (noimageindex)
          nosnippet: Disable text-snippes on page (nosnippet)

      reading_time:
        label: Estimated reading time
        help: Estimated reading time in seconds.
        placeholder: Reading time in seconds

      twitter:
        label: Twitter card
        auto_switch: Auto generate Twitter card
        title: Twitter title
        description: Twitter description

        image:
          label: Twitter image
          help: Displays an image on Twitter.
          reset: Reset image

      og:
        label: Open Graph tags
        auto_switch: Auto generate Open Graph tags
        title: Open Graph title

        description:
          label: Open Graph description
          placeholder: Custom Twitter description
